<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="최시후의 개인 홈페이지입니다.">
  <title>최시후 | 개인 홈페이지</title>
  <style>
    :root { --ink: #182338; --muted: #5d6b82; --surface: #fff; --line: #e5eaf2; --blue: #3667c9; --blue-soft: #edf3ff; --background: #f7f9fc; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--background); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.7; }
    .container { width: min(100% - 40px, 760px); margin: 0 auto; }
    .hero { padding: 80px 0 62px; background: linear-gradient(135deg, #f8fbff 0%, #edf3ff 100%); border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 13px; color: var(--blue); font-size: .86rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-size: clamp(2.25rem, 7vw, 3.8rem); letter-spacing: -.06em; line-height: 1.15; }
    .hero p:last-child { margin: 0; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.18rem); }
    main { padding: 42px 0 64px; }
    section { padding: 30px; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px rgba(24, 35, 56, .04); }
    h2 { margin-bottom: 16px; font-size: 1.25rem; letter-spacing: -.03em; }
    section p:last-child { margin-bottom: 0; }
    .interests { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0; list-style: none; }
    .interests li { padding: 8px 14px; background: var(--blue-soft); color: #284e9b; border-radius: 999px; font-weight: 600; font-size: .95rem; transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease; }
    .interests li:hover { transform: translateY(-3px); background: #e2edff; box-shadow: 0 7px 14px rgba(54, 103, 201, .18); }
    .contacts { display: grid; gap: 10px; }
    a { color: var(--blue); overflow-wrap: anywhere; text-underline-offset: 3px; }
    a:hover { color: #214d9f; }
    footer { padding: 0 0 36px; color: var(--muted); font-size: .9rem; text-align: center; }
    @media (max-width: 520px) { .container { width: min(100% - 28px, 760px); } .hero { padding: 58px 0 46px; } main { padding-top: 28px; } section { padding: 23px 21px; border-radius: 14px; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">Personal Website</p>
      <h1>최시후</h1>
      <p>게임과 연구를 좋아하는 탐구자</p>
    </div>
  </header>
  <main class="container">
    <section aria-labelledby="about-title">
      <h2 id="about-title">소개</h2>
      <p>안녕하세요, 최시후입니다. 게임과 연구에 관심이 많고, 새로운 것을 탐구하고 배우는 것을 좋아합니다. 여가 시간에는 발라드 음악을 즐겨 듣습니다.</p>
    </section>
    <section aria-labelledby="interests-title">
      <h2 id="interests-title">관심사</h2>
      <ul class="interests"><li>게임</li><li>연구</li><li>발라드 음악</li></ul>
    </section>
    <section aria-labelledby="contact-title">
      <h2 id="contact-title">연락처</h2>
      <div class="contacts">
        <a href="mailto:sihoo0813@snu.ac.kr">sihoo0813@snu.ac.kr</a>
        <a href="mailto:sihoo070813@gmail.com">sihoo070813@gmail.com</a>
      </div>
    </section>
  </main>
  <footer><div class="container">© 2026 최시후</div></footer>
</body>
</html>
