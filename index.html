<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="최시후의 개인 홈페이지입니다.">
  <title>최시후 | 개인 홈페이지</title>
  <style>
    :root { --black: #121212; --surface: #181818; --surface-hover: #252525; --muted: #b3b3b3; --white: #fff; --green: #1ed760; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--black); color: var(--white); font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; line-height: 1.55; }
    .shell { width: min(100% - 40px, 960px); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
    .brand { margin: 0; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .78rem; font-weight: 700; }
    .status::before { width: 8px; height: 8px; content: ""; background: var(--green); border-radius: 50%; }
    .profile { display: grid; grid-template-columns: 158px 1fr; gap: 34px; align-items: center; padding: 38px; background: var(--surface); border-radius: 10px; box-shadow: rgba(0, 0, 0, .5) 0 8px 24px; }
    .reveal { opacity: 0; transform: translateY(14px); transition: opacity .45s ease var(--delay, 0s), transform .45s ease var(--delay, 0s); }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .record { display: grid; width: 158px; aspect-ratio: 1; place-items: center; background: repeating-radial-gradient(circle, #252525 0 3px, #111 4px 7px); border-radius: 50%; box-shadow: inset 0 0 0 1px #353535; }
    .record span { display: grid; width: 48px; aspect-ratio: 1; place-items: center; background: var(--green); color: #000; border-radius: 50%; font-weight: 800; font-size: .82rem; }
    .label { margin: 0 0 8px; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(2.3rem, 7vw, 4.3rem); letter-spacing: -.055em; line-height: 1.05; }
    .role { margin: 0; color: var(--muted); font-size: 1rem; }
    main { display: grid; grid-template-columns: 1.35fr .85fr; gap: 20px; padding: 20px 0 32px; }
    .card { padding: 26px; background: var(--surface); border-radius: 8px; transition: background-color .2s ease; }
    .card:hover { background: var(--surface-hover); }
    .about { grid-row: span 2; }
    h2 { margin-bottom: 18px; font-size: 1.13rem; line-height: 1.3; }
    .about p { margin: 0; color: var(--muted); font-size: 1rem; }
    .interests { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
    .interests li { padding: 8px 14px; background: #1f1f1f; border-radius: 9999px; color: var(--white); font-size: .88rem; font-weight: 700; transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease, color .2s ease; }
    .interests li:hover { transform: translateY(-3px); background: var(--green); color: #000; box-shadow: 0 7px 14px rgba(0, 0, 0, .45); }
    .contacts { display: grid; gap: 0; }
    .contacts a { display: block; padding: 12px 0; border-top: 1px solid #333; color: var(--muted); font-size: .9rem; font-weight: 600; overflow-wrap: anywhere; text-decoration: none; transition: color .2s ease; }
    .contacts a:hover { color: var(--green); }
    footer { display: flex; align-items: center; gap: 12px; padding: 18px 0 34px; color: var(--muted); font-size: .75rem; }
    footer::before { width: 28px; height: 1px; content: ""; background: var(--green); }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
    @media (max-width: 680px) { .shell { width: min(100% - 28px, 960px); } .topbar { padding: 18px 0; } .profile { grid-template-columns: 1fr; gap: 24px; padding: 28px 24px; } .record { width: 116px; } main { grid-template-columns: 1fr; gap: 14px; padding-top: 14px; } .about { grid-row: auto; } .card { padding: 23px 21px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <p class="brand">Personal Profile</p>
      <span class="status">탐색 중</span>
    </header>
    <section class="profile reveal" style="--delay: .05s" aria-labelledby="name">
      <div class="record" aria-hidden="true"><span>CSH</span></div>
      <div>
        <p class="label">개인 프로필</p>
        <h1 id="name">최시후</h1>
        <p class="role">게임과 연구를 좋아하는 탐구자</p>
      </div>
    </section>
    <main>
      <section class="card about reveal" style="--delay: .1s" aria-labelledby="about-title">
        <p class="label">About</p>
        <h2 id="about-title">소개</h2>
        <p>안녕하세요, 최시후입니다. 게임과 연구에 관심이 많고, 새로운 것을 탐구하고 배우는 것을 좋아합니다. 여가 시간에는 발라드 음악을 즐겨 듣습니다.</p>
      </section>
      <section class="card reveal" style="--delay: .16s" aria-labelledby="interests-title">
        <p class="label">Library</p>
        <h2 id="interests-title">관심사</h2>
        <ul class="interests"><li>게임</li><li>연구</li><li>발라드 음악</li></ul>
      </section>
      <section class="card reveal" style="--delay: .22s" aria-labelledby="contact-title">
        <p class="label">Connect</p>
        <h2 id="contact-title">연락처</h2>
        <div class="contacts">
          <a href="mailto:sihoo0813@snu.ac.kr">sihoo0813@snu.ac.kr</a>
          <a href="mailto:sihoo070813@gmail.com">sihoo070813@gmail.com</a>
        </div>
      </section>
    </main>
    <footer>© 2026 최시후</footer>
  </div>
  <script>
    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    const revealItems = document.querySelectorAll('.reveal');

    if (motionQuery.matches || !('IntersectionObserver' in window)) {
      revealItems.forEach((item) => item.classList.add('is-visible'));
    } else {
      const observer = new IntersectionObserver((entries, activeObserver) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            activeObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      revealItems.forEach((item) => observer.observe(item));
    }
  </script>
</body>
</html>
